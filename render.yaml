# Render Blueprint: free-tier backend deployment (render.com -> New -> Blueprint).
#
# Free instance notes:
# - No credit card required; the service sleeps after 15 min idle and wakes on
#   the next request (~1 min cold start).
# - Disk is ephemeral. With DATABASE_URL pointing at managed Postgres (free
#   Neon tier), accounts/plans/chunks persist; the vector index rebuilds
#   lazily from stored chunks after each restart (see services/ai/reindex.py).
#   Uploaded source files are not retained after processing.
# - LLM_PROVIDER=demo means zero AI spend is possible. Swap in groq + a free
#   GROQ_API_KEY from the dashboard for real model answers, still at $0.

services:
  - type: web
    name: documind-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Postgres (e.g. free-tier Neon) so accounts, plans, and document
      # chunks survive restarts. Set in the dashboard, never committed.
      # Falls back to ephemeral SQLite only if unset.
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: demo
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: CHROMA_PERSIST_DIR
        value: /tmp/chroma_data
      - key: CORS_ORIGINS
        value: https://documind-ai-hazel-theta.vercel.app
      - key: FRONTEND_URL
        value: https://documind-ai-hazel-theta.vercel.app
      # Set these in the Render dashboard (never committed):
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates read better as natural prose than wrapped at 100 chars.
"app/services/ai/rag.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
